[project]
name = "turtle-agent"
version = "0.1.0"
description = "Ultra-fast Python CLI Agent"
requires-python = ">=3.11"
dependencies = [
    "uvloop>=0.19.0",
    "msgspec>=0.18.6",
    "httpx[http2]>=0.27.0",
    "prompt-toolkit>=3.0.43",
    "rich>=13.7.1"
]

[project.scripts]
turtle = "turtle.__main__:main"
